<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ username }} — Bookish</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</head>

<body>

    <div class="top-bar">
        <a href="/library" class="top-bar-logo">Bookish</a>
        <div style="display:flex;align-items:center;gap:12px;">
            <a href="/library" class="btn-outline">← Library</a>
            <button id="logoutBtn" class="btn-outline">Logout</button>
        </div>
    </div>

    <div class="profile-page">
        <div class="profile-header">
            <h1 class="profile-name">{{ username }}</h1>
            <p class="profile-sub">your uploads</p>
        </div>

        <hr class="divider">
        <p class="section-label">Books uploaded</p>

        {% for book in books %}
        <div class="book-row">
            <div class="book-info">
                <div class="book-title">{{ book.title }}</div>
                <div class="book-meta">{{ book.author }} &nbsp;·&nbsp; {{ book.timestamp }}</div>
            </div>
            <form action="{{ url_for('delete_book', book_id=book.id) }}" method="POST" id="deleteForm-{{ book.id }}">
                <button type="button" class="btn-danger"
                    onclick="confirmDelete('{{ book.id }}', '{{ book.title }}')">Delete</button>
            </form>
        </div>
        {% else %}
        <div class="empty-state-dashed">
            Nothing here yet — <a href="/upload">upload your first book</a>
        </div>
        {% endfor %}
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
