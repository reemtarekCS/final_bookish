<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload — Bookish</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="page-centered">

    <div class="upload-card">
        <h2>Upload a Book</h2>
        <p class="tagline">epub files only</p>

        <form action="/upload" method="post" enctype="multipart/form-data">
            <input class="file-input" type="file" name="file" accept=".epub" required>
            <input type="hidden" name="uploader" id="uploader-hidden">
            <button class="btn-primary" type="submit">Add to Library</button>
        </form>

        <a href="/library" class="back-link">← back to library</a>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
