<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookish</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</head>

<body class="page-centered">

    <div class="login-card">
        <h1>Bookish</h1>
        <p class="tagline">your personal library</p>

        <input class="input" type="text" id="username" placeholder="What should we call you..?"
            onkeydown="if(event.key === 'Enter') saveUser()">

        <button class="btn-primary" onclick="saveUser()">Enter Library</button>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
